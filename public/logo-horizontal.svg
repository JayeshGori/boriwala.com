  <!-- Wordmark Logo -->
  <text x="200" y="43" text-anchor="middle" font-family="'Montserrat', 'Raleway', 'Open Sans', sans-serif" font-size="32" font-weight="800" letter-spacing="2" fill="url(#textGradient)">BORIWALA<tspan fill="#f46f25">.COM</tspan></text>
