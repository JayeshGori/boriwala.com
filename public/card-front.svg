<svg width="1050" height="600" viewBox="0 0 525 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f46f25"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f46f25"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="525" height="300" fill="#ffffff"/>

  <!-- Accent bars -->
  <rect x="0" y="0" width="525" height="8" fill="url(#topBar)"/>
  <rect x="0" y="292" width="525" height="8" fill="url(#bottomBar)"/>

  <!-- Wordmark Logo (centered) -->
  <g text-anchor="middle">
    <text x="262.5" y="142" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="2" fill="url(#textGradient)">BORIWALA<tspan fill="#f46f25">.COM</tspan></text>
    <line x1="95" y1="162" x2="430" y2="162" stroke="#f46f25" stroke-width="3" stroke-linecap="round"/>
    <text x="262.5" y="190" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="7" fill="#f46f25">BAGS THAT MATTER</text>
  </g>
</svg>
